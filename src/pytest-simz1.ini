[pytest]
# Opt in explicitly: python -m pytest -c pytest-simz1.ini
# This does not change unittest discovery or existing CI/default pytest collection.
# Contract evidence and execution effects: docs/maintenance/simz1-test-contracts.csv
pythonpath = python
cache_dir = runtime/pytest/cache
addopts = -ra
testpaths =
    # Imported OSM topology, directed roads, lanes and signal inputs.
    python/test_filter_zona1_osm.py
    python/test_prepare_simz1.py
    python/test_simz1_road_parameters.py
    python/test_lanes_z1.py
    python/test_signal_inputs_z1.py
    python/test_simz1_lane_validation.py
    python/test_simz1_osm_turn_audit.py
    # Routing/configuration, native decision evidence and priority classification.
    python/test_simz1_master_config.py
    python/test_simz1_event_validation.py
    python/test_simz1_priority.py
    python/test_simz1_priority_classification.py
    python/test_simz1_signals_config.py
    python/test_simz1_signals_replay.py
    # Spatial OD, reproducible demand, daily boundaries and exact counts.
    python/test_simz1_gateway_od.py
    python/test_simz1_gateway_generation.py
    python/test_simz1_agent_types.py
    python/test_simz1_agent_demand.py
    python/test_simz1_agent_metadata.py
    python/test_generate_demand_z1.py
    python/test_generate_montecarlo_z1.py
    python/test_generate_test_agent.py
    python/test_simz1_massive_demand.py
    python/test_simz1_daily_defaults.py
    python/test_simz1_temporal.py
    # Run lifecycle, hashing, numeric iteration order, censoring and metrics.
    python/test_ejecutar_simz1.py
    python/test_simz1_run_directory.py
    python/test_simz1_run.py
    python/test_generar_graficas_z1.py
    python/test_procesar_eventos_z1.py
    python/test_simz1_trip_table.py
    python/test_simz1_profile_identity_cache.py
    python/test_simz1_profile_statistics.py
    python/test_simz1_analysis.py
    python/test_simz1_operational_report.py
    python/test_simz1_capacity_diagnostics.py
    # Motion, native lane evidence, visual geometry and selected trip lifetime.
    python/test_simz1_motion.py
    python/test_simz1_visual_motion.py
    python/test_simz1_visual_motion_integration.py
    python/test_simz1_lane_replay.py
    python/test_simz1_visual_lanes.py
    python/test_simz1_selection_metadata.py
    python/test_simz1_spatial_replay.py
    # Export/SQLite compatibility remains required by continuous streaming.
    python/test_visualizador_z1.py
    python/test_simz1_paged_replay.py
    # Current daily viewer, HUD, HTTP security/cache, launcher and validation CLIs.
    python/test_simz1_daily_window.py
    python/test_simz1_continuous_hud.py
    python/test_simz1_continuous_replay.py
    python/test_simz1_replay_launch.py
    python/test_simz1_validation_cli.py
# No production QSim or browser is launched by these Python suites. Some tests
# start short-lived HTTP servers/Python subprocesses and write temporary data.
# Monte Carlo includes 1000-person fixtures and a historical 10000-person case.
# Initial manual checks can deselect those two cases by their explicit node IDs.
# Temporal uses 300000 RNG samples
# (not persons); streaming fixtures include 20000 trips and 50000 ignored events.
# Cross-language TripTable evidence may skip when its Java fixture is absent.
# Lab05..08/microscopic playback are intentionally not selected or modified.
